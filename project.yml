# Fallback: if OutAndScout.xcodeproj ever gets into a bad state, regenerate it with
#   brew install xcodegen && xcodegen
name: OutAndScout
options:
  bundleIdPrefix: com.outandscout
  deploymentTarget:
    iOS: "18.0"
targets:
  OutAndScout:
    type: application
    platform: iOS
    sources: [OutAndScout]
    dependencies:
      - target: ShootDayWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.outandscout.app
        # Document types (PDF in, for Shoot day); merged with the generated keys below.
        INFOPLIST_FILE: Config/OutAndScout-Info.plist
        DEVELOPMENT_TEAM: CF8HY3UXL4
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 3
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: "Out & Scout"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSCameraUsageDescription: "The viewfinder uses the camera to frame shots."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Save your stills to Photos, cropped to their frame lines."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Names each scene after the street you're on, tags shots with where they were taken, works out the sun for that spot, and (if you turn it on) gets the weather forecast there."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_UIColorName: LaunchBackground
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"

  # Shoot day lock-screen / Control Centre button (iOS 18 control). Opens the app on the
  # pinned PDF via OpenShootDayIntent, which is compiled into both targets.
  ShootDayWidget:
    type: app-extension
    platform: iOS
    sources:
      - ShootDayWidget
      - OutAndScout/App/ShootDayIntent.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.outandscout.app.shootday
        DEVELOPMENT_TEAM: CF8HY3UXL4
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 3
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: Config/ShootDayWidget-Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Out & Scout"
        SKIP_INSTALL: YES
